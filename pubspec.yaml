name: aura_assistant
description: AURA ASSISTANT - AI-powered personal assistant with Sorani Kurdish as default language.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.4
  intl: ^0.20.3
  http: ^1.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  sqflite: ^2.4.1
  path:
  path_provider: ^2.1.5
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  device_info_plus: ^11.2.0
  connectivity_plus: ^6.1.2
  flutter_secure_storage: ^9.2.4
  android_alarm_manager_plus: ^4.0.6
  audioplayers: ^6.1.0
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.11.0
  vibration: ^2.0.0
  flutter_local_notifications: ^18.0.1
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  test: ^1.25.8

flutter:
  generate: true
  uses-material-design: true
