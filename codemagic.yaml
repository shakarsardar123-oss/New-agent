workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Build Android App
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
